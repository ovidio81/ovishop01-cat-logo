<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OviShop01 — Catálogo</title>
<meta name="description" content="Calzado y ropa 100% original. Envío incluido a Venezuela. Pide por WhatsApp.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f6f6;color:#111}
.banner{background:#111;color:#fff;text-align:center;padding:12px 10px;font-weight:700}
header{padding:18px 14px 8px;text-align:center}h1{margin:0;font-size:26px}header p{margin:6px 0;color:#444}
.controls{max-width:1100px;margin:0 auto;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
.controls input{flex:1;min-width:200px;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px}
.controls select,.controls button{padding:11px;border:1px solid #ccc;border-radius:10px;font-size:15px;background:#fff}
#count{max-width:1100px;margin:0 auto;padding:2px 14px 10px;color:#333}
.grid{max-width:1100px;margin:0 auto;padding:0 14px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12);position:relative}
.card img{width:100%;height:240px;object-fit:cover;display:block;background:#eee}
.card-body{padding:12px}.cat{font-size:12px;text-transform:uppercase;color:#666;letter-spacing:.4px}
.card h3{margin:4px 0;font-size:17px}.desc{font-size:14px;color:#444;margin:6px 0}
.specs{font-size:13px;color:#333}.price{font-size:22px;font-weight:800;margin-top:8px}
.note{font-size:13px;color:#0a6b2e;font-weight:700}
.wa{display:block;text-align:center;background:#25d366;color:#fff;text-decoration:none;font-weight:800;padding:11px;border-radius:10px;margin-top:10px}
.wa.disabled{background:#999;pointer-events:none}
.sold{position:absolute;top:10px;right:10px;background:#d00;color:#fff;font-weight:900;padding:7px 10px;border-radius:8px;transform:rotate(3deg);border:2px solid #fff}
footer{max-width:1100px;margin:0 auto;padding:0 14px 30px;text-align:center;color:#444}
footer a{color:#111;font-weight:700}
</style>
</head>
<body>
<div class="banner">📦 Envío incluido a Venezuela en todos los productos</div>
<header><h1>🛍️ OviShop01</h1><p>Calzado y ropa 100% original · Pide por WhatsApp: <a href="https://wa.me/17868180740">+17868180740</a></p><p>De Miami a Venezuela, 100% original y en una semana.</p></header>
<div class="controls">
<input id="q" type="search" placeholder="Buscar: Nike, Adidas, reloj, US 10, EU 44…">
<select id="cat"><option value="">Todas las categorías</option><option value="calzado">Calzado</option><option value="ropa">Ropa</option><option value="relojes">Relojes</option><option value="accesorios">Accesorios</option></select>
<select id="sizeUS"><option value="">Talla US (todas)</option></select>
<select id="sizeEU"><option value="">Talla EU (todas)</option></select>
<button id="avail">Solo disponibles</button>
</div>
<div id="count"></div>
<div class="grid" id="grid"></div>
<footer><p>¿No ves lo que buscas? Escríbenos por WhatsApp y te lo buscamos en Miami: <a href="https://wa.me/17868180740">wa.me/17868180740</a></p></footer>
<script>
let all=[],onlyAvail=false;
function sizesOf(p){const s=(p.specs||[]).join(' ');const us=[...s.matchAll(/US\s*(\d+(?:\.\d+)?)/g)].map(m=>m[1]);const eu=[...s.matchAll(/EU\s*(\d+(?:\.\d+)?)/g)].map(m=>m[1]);return{us,eu};}
function fillSizes(){
 const cu={},ce={};
 all.forEach(p=>{const s=sizesOf(p);[...new Set(s.us)].forEach(v=>cu[v]=(cu[v]||0)+1);[...new Set(s.eu)].forEach(v=>ce[v]=(ce[v]||0)+1);});
 const su=document.getElementById('sizeUS'),se=document.getElementById('sizeEU');
 su.innerHTML='<option value="">Talla US (todas)</option>'+Object.keys(cu).sort((a,b)=>a-b).map(v=>`<option value="${v}">US ${v} (${cu[v]})</option>`).join('');
 se.innerHTML='<option value="">Talla EU (todas)</option>'+Object.keys(ce).sort((a,b)=>a-b).map(v=>`<option value="${v}">EU ${v} (${ce[v]})</option>`).join('');
}
async function load(){all=[];for(let i=0;i<6;i++){const r=await fetch('products-'+i+'.json');all=all.concat(await r.json());}all.sort((a,b)=>a.n-b.n);fillSizes();render();}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fixImg(el){if(el.dataset.fixed)return;el.dataset.fixed='1';fetch(el.getAttribute('src')).then(r=>r.text()).then(t=>{t=t.trim();if(!/^[A-Za-z0-9+/=]+$/.test(t))return;const bin=atob(t);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);el.src=URL.createObjectURL(new Blob([bytes],{type:'image/webp'}));}).catch(()=>{});}
function render(){
 const q=(document.getElementById('q').value||'').toLowerCase().trim();
 const c=document.getElementById('cat').value;
 const fus=document.getElementById('sizeUS').value;
 const feu=document.getElementById('sizeEU').value;
 const list=all.filter(p=>{
   if(c&&p.category!==c)return false;
   if(onlyAvail&&p.sold)return false;
   if(fus||feu){const s=sizesOf(p);if(fus&&!s.us.includes(fus))return false;if(feu&&!s.eu.includes(feu))return false;}
   if(!q)return true;
   const hay=(p.name+' '+p.brand+' '+p.desc+' '+(p.specs||[]).join(' ')+' '+p.price).toLowerCase();
   return q.split(/\s+/).every(w=>hay.includes(w));
 });
 document.getElementById('count').textContent=list.length+' productos · '+all.filter(p=>!p.sold).length+' disponibles';
 document.getElementById('grid').innerHTML=list.map(p=>`
  <article class="card">
   ${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy" onerror="fixImg(this)">`:''}
   ${p.sold?'<div class="sold">VENDIDO</div>':''}
   <div class="card-body">
    <div class="cat">${esc(p.brand||p.category)}</div>
    <h3>${esc(p.name)}</h3>
    <p class="desc">${esc(p.desc)}</p>
    <div class="specs">${(p.specs||[]).map(esc).join(' · ')}</div>
    <div class="price">${esc(p.price)}</div>
    <div class="note">Envío incluido a Venezuela 🇻🇪</div>
    ${p.sold?'<span class="wa disabled">Vendido — Ya no disponible</span>':`<a class="wa" href="${esc(p.wa)}" target="_blank" rel="noopener">Quiero este — WhatsApp</a>`}
   </div>
  </article>`).join('')||'<p>Sin resultados. Prueba otra búsqueda.</p>';
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('cat').addEventListener('change',render);
document.getElementById('sizeUS').addEventListener('change',render);
document.getElementById('sizeEU').addEventListener('change',render);
document.getElementById('avail').addEventListener('click',e=>{onlyAvail=!onlyAvail;e.target.textContent=onlyAvail?'Mostrar todos':'Solo disponibles';render();});
load();
</script>
</body>
</html>
